# Hana firmware package: seven standard images plus the two MCU-specific reset images.
---
include:
  # Hana halves use Seeed XIAO nRF52840.
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: hana_settings_reset_xiao

  # Dongle uses the ProMicro/nice!nano nRF52840 target.
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: hana_settings_reset_dongle

  # BLE mode: left half is central; right half is peripheral.
  - board: xiao_ble//zmk
    shield: hana_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_left_central

  # Split halves for dongle-central mode.
  - board: xiao_ble//zmk
    shield: hana_peripheral_left
    artifact-name: hana_left_peripheral

  - board: xiao_ble//zmk
    shield: hana_peripheral_right
    artifact-name: hana_right_peripheral

  # Central dongle variants.
  - board: nice_nano//zmk
    shield: hana_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_dongle_no_display

  - board: nice_nano//zmk
    shield: hana_central_dongle_128x32 dongle_display oled_adapter_pro_micro_128x32
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_dongle_central_128x32

  - board: nice_nano//zmk
    shield: hana_central_dongle_128x64 dongle_display oled_adapter_pro_micro_128x64
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_dongle_central_128x64
