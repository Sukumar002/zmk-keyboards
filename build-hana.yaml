---
include:
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: hana_xiao_settings_reset

  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: hana_dongle_settings_reset

  # BLE mode: left half is central; right half is peripheral.
  - board: xiao_ble//zmk
    shield: hana_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_ble_left_central

  # Shared right peripheral: same firmware works with left-central or dongle-central.
  - board: xiao_ble//zmk
    shield: hana_peripheral_right
    artifact-name: hana_right_peripheral

  # Dongle mode.
  - board: xiao_ble//zmk
    shield: hana_peripheral_left
    artifact-name: hana_dongle_left_peripheral

  - board: nice_nano//zmk
    shield: hana_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_dongle_no_display

  - board: nice_nano//zmk
    shield: hana_central_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_dongle_128x32

  - board: nice_nano//zmk
    shield: hana_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_dongle_128x64
