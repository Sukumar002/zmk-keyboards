---
include:
  # Reset images
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: hana_xiao_settings_reset

  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: hana_dongle_settings_reset

  # Hana halves: these two peripheral images pair with the central dongle.
  - board: xiao_ble//zmk
    shield: hana_peripheral_left
    artifact-name: hana_left_peripheral

  - board: xiao_ble//zmk
    shield: hana_peripheral_right
    artifact-name: hana_right_peripheral

  # Central dongle display variants.
  - board: nice_nano//zmk
    shield: hana_central_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_dongle_oled_128x32

  - board: nice_nano//zmk
    shield: hana_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: hana_dongle_oled_128x64

  # Pro Micro footprint GPIO validation image.
  - board: nice_nano//zmk
    shield: tester_pro_micro
    artifact-name: hana_dongle_promicro_gpio_tester
