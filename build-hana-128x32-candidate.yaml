  - board: nice_nano//zmk
    shield: hana_central_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: >-
      -DCONFIG_ZMK_STUDIO=y
      -DCONFIG_ZMK_DISPLAY=y
      -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
      -DCONFIG_ZMK_DONGLE_DISPLAY_COMPACT_MODE=y
      -DCONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
      -DCONFIG_ZMK_DONGLE_DISPLAY_WPM=n
      -DCONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=n
      -DCONFIG_ZMK_DONGLE_DISPLAY_LAYER=n
      -DCONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n
      -DCONFIG_ZMK_HID_INDICATORS=n
      -DCONFIG_LV_Z_VDB_SIZE=32
    artifact-name: hana dongle central 128x32 base-status
