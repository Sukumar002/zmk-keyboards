---
include:
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: corne_settings_reset

  - board: nice_nano//zmk
    shield: corne_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_left_central

  - board: nice_nano//zmk
    shield: corne_peripheral_left
    artifact-name: corne_left_peripheral

  - board: nice_nano//zmk
    shield: corne_peripheral_right
    artifact-name: corne_right_peripheral

  - board: nice_nano//zmk
    shield: corne_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_dongle_no_display

  - board: nice_nano//zmk
    shield: corne_central_dongle_128x32 dongle_display oled_adapter_pro_micro_128x32
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_dongle_central_128x32

  - board: nice_nano//zmk
    shield: corne_central_dongle_128x64 dongle_display oled_adapter_pro_micro_128x64
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_dongle_central_128x64
