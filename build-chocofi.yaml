---
include:
  # Chocofi uses the nice!nano / Pro Micro nRF52840 target for all six images.
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: chocofi_settings_reset

  # BLE mode: left half is central; right half is peripheral.
  - board: nice_nano//zmk
    shield: chocofi_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi_left_central

  # Dongle mode: each physical half runs its own peripheral image.
  - board: nice_nano//zmk
    shield: chocofi_peripheral_left
    artifact-name: chocofi_left_peripheral

  - board: nice_nano//zmk
    shield: chocofi_peripheral_right
    artifact-name: chocofi_right_peripheral

  # Dongle central, matching Hana's two OLED sizes.
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi_dongle_central_128x64

  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi_dongle_central_128x32
