---
include:
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: chocofi settings reset
  # BLE mode: left half is central; right half is peripheral.
  - board: nice_nano//zmk
    shield: chocofi_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi left central
  # Shared right peripheral: same firmware is used in BLE and dongle modes.
  - board: nice_nano//zmk
    shield: chocofi_peripheral_right
    artifact-name: chocofi right peripheral
  # Dongle mode: both physical halves are peripherals.
  - board: nice_nano//zmk
    shield: chocofi_peripheral_left
    artifact-name: chocofi left peripheral
  - board: nice_nano//zmk
    shield: chocofi_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi dongle no display
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi dongle central 128x32
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: chocofi dongle central 128x64