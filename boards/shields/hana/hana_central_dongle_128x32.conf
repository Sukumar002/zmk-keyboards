# Pro Micro-footprint central dongle with two Hana BLE peripherals.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_BATTERY=y
CONFIG_BT_BAS=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_HID_INDICATORS=y

# Use the standard ZMK display/LVGL path; do not compile the raw framebuffer.
CONFIG_ZMK_DISPLAY=y
CONFIG_HANA_RAW_DASHBOARD=n
CONFIG_ZMK_DONGLE_DISPLAY_COMPACT_MODE=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_WPM=n
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_IDLE_TIMEOUT=60000

# The panel is 128x32; keep the LVGL draw buffer at panel height.
CONFIG_LV_Z_VDB_SIZE=32
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
