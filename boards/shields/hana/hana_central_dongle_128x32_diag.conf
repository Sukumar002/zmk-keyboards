# Diagnostic variant: keep the 128x32 SSD1306/I2C path, but do not compile or initialize the custom raw dashboard.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Two Hana peripherals plus host profiles
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Battery-powered dongle support
CONFIG_ZMK_BATTERY=y
CONFIG_BT_BAS=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_POINTING=y

# Keep the same standalone Zephyr SSD1306/I2C display stack as the failing 32px build.
# Intentionally omit CONFIG_DONGLE_DISPLAY_RAW_DASHBOARD.
CONFIG_ZMK_DISPLAY=n
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_I2C=y
CONFIG_ZMK_HID_INDICATORS=y
