# Explicit split peripheral role
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Enable keyboard-driven mouse emulation
CONFIG_ZMK_POINTING=y

# Report the XIAO nRF52840 charger status to the dongle central.
CONFIG_HANA_CHARGE_STATUS=y

# Universal dongle identity (protocol v1): Hana left half.
CONFIG_ZMK_UNIVERSAL_DONGLE_PERIPHERAL_IDENTITY=y
CONFIG_ZMK_UNIVERSAL_DONGLE_BOARD_ID=1
CONFIG_ZMK_UNIVERSAL_DONGLE_SIDE_ID=1
