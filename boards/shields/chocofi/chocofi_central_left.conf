CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Studio RPC serial transport stack headroom for full keymap enumeration.
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=8192
CONFIG_ZMK_STUDIO_TRANSPORT_UART_RX_STACK_SIZE=1024
