---
include:
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: sofle settings reset
  # BLE mode: left half is central; right half is peripheral.
  - board: nice_nano//zmk
    shield: sofle_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle left central
  # Shared right peripheral: same firmware is used in BLE and dongle modes.
  - board: nice_nano//zmk
    shield: sofle_peripheral_right
    artifact-name: sofle right peripheral
  # Dongle mode: both physical halves are peripherals.
  - board: nice_nano//zmk
    shield: sofle_peripheral_left
    artifact-name: sofle left peripheral
  - board: nice_nano//zmk
    shield: sofle_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle dongle no display
  - board: nice_nano//zmk
    shield: sofle_central_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle dongle central 128x32
  - board: nice_nano//zmk
    shield: sofle_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle dongle central 128x64