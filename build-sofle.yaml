---
include:
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: sofle_settings_reset

  # BLE mode: left half is central; right half is peripheral.
  - board: nice_nano//zmk
    shield: sofle_central_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_ble_left_central

  # Shared right peripheral: same firmware is used in BLE and dongle modes.
  - board: nice_nano//zmk
    shield: sofle_peripheral_right
    artifact-name: sofle_right_peripheral

  # Dongle mode: both physical halves are peripherals.
  - board: nice_nano//zmk
    shield: sofle_peripheral_left
    artifact-name: sofle_dongle_left_peripheral

  - board: nice_nano//zmk
    shield: sofle_central_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_dongle_no_display

  - board: nice_nano//zmk
    shield: sofle_central_dongle_128x32 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_dongle_128x32

  - board: nice_nano//zmk
    shield: sofle_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_dongle_128x64
