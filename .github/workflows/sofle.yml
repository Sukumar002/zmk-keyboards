name: "Build Sofle Firmware"

on:
  push:
    branches:
      - main
      - multi-board-baseline
      - sofle-hana-port-baseline
    paths:
      - "boards/shields/sofle/**"
      - "boards/shields/common/**"
      - "build-sofle.yaml"
      - ".github/workflows/sofle.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  pull_request:
    branches:
      - main
    paths:
      - "boards/shields/sofle/**"
      - "boards/shields/common/**"
      - "build-sofle.yaml"
      - ".github/workflows/sofle.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  workflow_dispatch:

concurrency:
  group: "sofle-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-sofle.yaml
      archive_name: sofle-firmware
