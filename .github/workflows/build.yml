name: "Build ZMK Firmware"

on:
  push:
    branches:
      - main
      - multi-board-baseline
      - architecture/implementation-clean
      - fix/chocofi-keymap-studio-oled
      - fix/chocofi-hardware-validation
    paths:
      - "boards/shields/**"
      - "boards/shields/common/**"
      - "build-chocofi.yaml"
      - ".github/workflows/build.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  pull_request:
    branches:
      - main
      - architecture/implementation-clean
      - architecture/validation-base
    paths:
      - "boards/shields/**"
      - "boards/shields/common/**"
      - "build-chocofi.yaml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  workflow_dispatch:

concurrency:
  group: "zmk-firmware-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-chocofi.yaml
      archive_name: zmk-keyboards-chocofi
