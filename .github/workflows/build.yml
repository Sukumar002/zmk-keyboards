name: "Build Hana Firmware"

on:
  push:
    branches:
      - main
      - multi-board-baseline
      - feature/shared-firmware-architecture
      - feature/reconciled-multi-board-oled
      - mvp/all-shields-oled-studio
      - fix/hana-layer-status-128x32-parity
      - feature/hana-right-panel
      # Isolated 128x32 right-panel validation branch.
    paths:
      - "boards/shields/hana/**"
      - "boards/shields/common/**"
      - "build-hana.yaml"
      - ".github/workflows/hana.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/build.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  pull_request:
    branches:
      - main
    paths:
      - "boards/shields/hana/**"
      - "boards/shields/common/**"
      - "build-hana.yaml"
      - ".github/workflows/hana.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  workflow_dispatch:

concurrency:
  group: "hana-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-hana.yaml
      archive_name: hana-firmware
