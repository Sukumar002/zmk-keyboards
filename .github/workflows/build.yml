name: "Build ZMK Firmware"

on:
  push:
    branches:
      - main
      - multi-board-baseline
      - architecture/implementation-clean
      - fix/chocofi-keymap-studio-oled
      - fix/chocofi-layout-shift-timing-366
      - fix/chocofi-studio-rpc-recovery
    paths:
      - "boards/shields/**"
      - "boards/shields/common/**"
      - "build-chocofi.yaml"
      - ".github/workflows/build.yml"
      - ".github/firmware/**"
      - ".github/scripts/**"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  pull_request:
    branches:
      - main
      - architecture/implementation-clean
      - architecture/validation-base
    paths:
      - "boards/shields/**"
      - "boards/shields/common/**"
      - "build-chocofi.yaml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  workflow_dispatch:

concurrency:
  group: "zmk-firmware-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-chocofi.yaml
      archive_name: zmk-keyboards-chocofi-raw

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out packaging files
        uses: actions/checkout@v4

      - name: Download raw firmware outputs
        uses: actions/download-artifact@v4
        with:
          name: zmk-keyboards-chocofi-raw
          path: raw

      - name: Apply standard firmware filenames
        run: |
          bash .github/scripts/package-firmware.sh \
            --input raw \
            --output dist \
            --manifest .github/firmware/chocofi-artifacts.tsv

      - name: Upload standardized firmware
        uses: actions/upload-artifact@v4
        with:
          name: zmk-keyboards-chocofi
          path: dist/*.uf2
          if-no-files-found: error
          compression-level: 0
