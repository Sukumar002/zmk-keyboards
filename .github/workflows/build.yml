name: "Build Hana Firmware"

on:
  push:
    branches:
      - main
      - chocofi-setup
    paths:
      - "boards/shields/hana/**"
      - "build-hana.yaml"
      - ".github/workflows/build.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  pull_request:
    branches:
      - main
    paths:
      - "boards/shields/hana/**"
      - "build-hana.yaml"
      - ".github/workflows/build.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  workflow_dispatch:

concurrency:
  group: "hana-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-hana.yaml
      archive_name: hana-firmware
