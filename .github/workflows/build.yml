name: "Build ZMK Firmware"

on:
  push:
    branches:
      - main
      - multi-board-baseline
      - architecture/implementation-clean
    paths:
      - "boards/shields/**"
      - "boards/shields/common/**"
      - "build-all.yaml"
      - "build-hana.yaml"
      - "build-chocofi.yaml"
      - "build-sofle.yaml"
      - "build-corne.yaml"
      - ".github/workflows/build.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  pull_request:
    branches:
      - main
    paths:
      - "boards/shields/**"
      - "boards/shields/common/**"
      - "build-all.yaml"
      - "build-hana.yaml"
      - "build-chocofi.yaml"
      - "build-sofle.yaml"
      - "build-corne.yaml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  workflow_dispatch:

concurrency:
  group: "zmk-firmware-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-all.yaml
      archive_name: zmk-keyboards-firmware
