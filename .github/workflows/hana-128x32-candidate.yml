name: "Hana 128x32 Base Status Candidate"

# Isolated 128x32 hardware test. No 128x64 build is part of this workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/hana-128x32-raw-baseline
    paths:
      - "config/**"
      - "boards/shields/hana/**"
      - "build-hana-128x32-candidate.yaml"
      - ".github/workflows/hana-128x32-candidate.yml"

permissions:
  contents: read

concurrency:
  group: "hana-128x32-base-status"
  cancel-in-progress: false

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-hana-128x32-candidate.yaml
      archive_name: hana-128x32-base-status
