name: "Runner Queue Diagnostic"

on:
  push:
    branches:
      - experiment/universal-dongle
    paths:
      - ".github/workflows/runner-queue-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm hosted runner allocation
        run: |
          echo "Hosted runner acquired"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          date -u
