name: "Universal Dongle Project - Manual Diagnostics Only"

on:
  # These reference builds are not flashable universal-dongle firmware.
  # Keep them opt-in so normal project/docs changes generate only the
  # seven-image hardware candidate from universal-dongle-routing-smoke.yml.
  workflow_dispatch:

concurrency:
  group: universal-dongle-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-universal-dongle-project.yaml
      archive_name: universal-dongle-project-diagnostics
