name: "Build Sweep Firmware"

on:
  push:
    branches:
      - main
    paths:
      - "boards/shields/sweep/**"
      - "boards/shields/common/**"
      - "build-sweep.yaml"
      - ".github/workflows/sweep.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  pull_request:
    branches:
      - main
    paths:
      - "boards/shields/sweep/**"
      - "boards/shields/common/**"
      - "build-sweep.yaml"
      - ".github/workflows/sweep.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  workflow_dispatch:

concurrency:
  group: "sweep-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-sweep.yaml
      archive_name: sweep-firmware
