name: "Build Corne Firmware"

on:
  push:
    branches:
      - main
      - multi-board-baseline
    paths:
      - "boards/shields/corne/**"
      - "boards/shields/common/**"
      - "build-corne.yaml"
      - ".github/workflows/corne.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  pull_request:
    branches:
      - main
    paths:
      - "boards/shields/corne/**"
      - "boards/shields/common/**"
      - "build-corne.yaml"
      - ".github/workflows/corne.yml"
      - "config/**"
      - "snippets/**"
      - "src/**"
      - "dts/**"
      - "layout_shift/**"
      - "zephyr/**"
      - "CMakeLists.txt"
      - "Kconfig"
  workflow_dispatch:

concurrency:
  group: "corne-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: build-corne.yaml
      archive_name: corne-firmware
