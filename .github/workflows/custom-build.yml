name: "Firmware Build Console"
run-name: "Builder ${{ inputs.build_label || inputs.board }} · ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Keyboard"
        required: true
        type: choice
        options:
          - hana
          - chocofi
          - sofle
          - corne
      connectivity:
        description: "Connectivity"
        required: true
        type: choice
        options:
          - ble
          - dongle
      split_mcu:
        description: "Split halves MCU"
        required: true
        type: choice
        default: nice_nano
        options:
          - nice_nano
          - xiao_ble
      dongle_mcu:
        description: "Dongle MCU (ignored for BLE)"
        required: true
        type: choice
        default: nice_nano
        options:
          - nice_nano
          - xiao_ble
      dongle_display:
        description: "Dongle display (ignored for BLE)"
        required: true
        type: choice
        default: 128x64
        options:
          - none
          - 128x32
          - 128x64
      build_label:
        description: "Optional customer/job label"
        required: false
        type: string
      request_id:
        description: "Builder service request ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix_path: ${{ steps.select.outputs.matrix_path }}
      archive_name: ${{ steps.select.outputs.archive_name }}
      raw_archive_name: ${{ steps.select.outputs.raw_archive_name }}
      file_prefix: ${{ steps.select.outputs.file_prefix }}
    steps:
      - name: Validate selection
        id: select
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          CONNECTIVITY: ${{ inputs.connectivity }}
          SPLIT_MCU: ${{ inputs.split_mcu }}
          DONGLE_MCU: ${{ inputs.dongle_mcu }}
          DISPLAY: ${{ inputs.dongle_display }}
          BUILD_LABEL: ${{ inputs.build_label }}
        run: |
          set -euo pipefail

          case "$BOARD" in
            hana)
              [[ "$SPLIT_MCU" == "xiao_ble" ]] || {
                echo "::error::Hana currently has validated build definitions only for XIAO nRF52840 split halves."
                exit 1
              }
              if [[ "$CONNECTIVITY" == "dongle" ]]; then
                [[ "$DONGLE_MCU" == "nice_nano" ]] || {
                  echo "::error::Hana currently has a validated dongle definition only for nice!nano v2 / Pro Micro nRF52840."
                  exit 1
                }
              fi
              ;;
            chocofi|corne|sofle)
              [[ "$SPLIT_MCU" == "nice_nano" ]] || {
                echo "::error::$BOARD currently has validated build definitions only for nice!nano v2 / Pro Micro nRF52840 split halves."
                exit 1
              }
              if [[ "$CONNECTIVITY" == "dongle" ]]; then
                [[ "$DONGLE_MCU" == "nice_nano" ]] || {
                  echo "::error::$BOARD currently has a validated dongle definition only for nice!nano v2 / Pro Micro nRF52840."
                  exit 1
                }
              fi
              ;;
            *)
              echo "::error::Unsupported board: $BOARD"
              exit 1
              ;;
          esac

          if [[ "$CONNECTIVITY" == "ble" ]]; then
            matrix="build-console/$BOARD-ble.yaml"
          else
            case "$DISPLAY" in
              none|128x32|128x64) ;;
              *) echo "::error::Unsupported display selection: $DISPLAY"; exit 1 ;;
            esac
            matrix="build-console/$BOARD-dongle-$DISPLAY.yaml"
          fi

          label="$(printf '%s' "$BUILD_LABEL" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          archive="$BOARD-$CONNECTIVITY"
          if [[ "$CONNECTIVITY" == "dongle" ]]; then
            archive="$archive-$DISPLAY"
          fi
          if [[ -n "$label" ]]; then
            archive="$archive-$label"
          else
            archive="$archive-$stamp"
          fi

          if [[ -n "$label" ]]; then
            file_prefix="$label"
          else
            file_prefix="$archive"
          fi
          raw_archive="raw-$archive"

          echo "matrix_path=$matrix" >> "$GITHUB_OUTPUT"
          echo "archive_name=$archive" >> "$GITHUB_OUTPUT"
          echo "raw_archive_name=$raw_archive" >> "$GITHUB_OUTPUT"
          echo "file_prefix=$file_prefix" >> "$GITHUB_OUTPUT"

          {
            echo "### Firmware build selection"
            echo ""
            echo "- Board: **$BOARD**"
            echo "- Connectivity: **$CONNECTIVITY**"
            echo "- Split halves MCU: **$SPLIT_MCU**"
            if [[ "$CONNECTIVITY" == "dongle" ]]; then
              echo "- Dongle MCU: **$DONGLE_MCU**"
              echo "- Dongle display: **$DISPLAY**"
            fi
            echo "- Matrix: `$matrix`"
            echo "- Final artifact archive: **$archive**"
            echo "- Firmware filename prefix: **$file_prefix**"
            echo ""
            echo "This workflow uploads an Actions artifact only. It does not create a release or tag."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: ${{ needs.prepare.outputs.matrix_path }}
      archive_name: ${{ needs.prepare.outputs.raw_archive_name }}

  package:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Download raw firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.raw_archive_name }}
          path: raw-firmware

      - name: Add client/job tag to firmware filenames
        shell: bash
        env:
          PREFIX: ${{ needs.prepare.outputs.file_prefix }}
        run: |
          set -euo pipefail
          mkdir -p final-firmware
          shopt -s nullglob
          files=(raw-firmware/*)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No firmware files were found in the raw build artifact."
            exit 1
          fi
          for src in "${files[@]}"; do
            name="$(basename "$src")"
            cp "$src" "final-firmware/${PREFIX}-${name}"
          done
          echo "### Final firmware package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Files:" >> "$GITHUB_STEP_SUMMARY"
          for file in final-firmware/*; do
            echo "- `$(basename "$file")`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload client-ready firmware package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.archive_name }}
          path: final-firmware
          if-no-files-found: error
          retention-days: 30
