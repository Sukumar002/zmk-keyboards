---
# Baseline ONLY: two independent central builds on the SAME nRF52840 target.
# These do not switch keyboards yet; compare memory usage before combining them.
include:
  - board: nice_nano//zmk
    shield: hana_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: universal_baseline_hana_128x64
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: universal_baseline_chocofi_128x64
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_UNIVERSAL_DONGLE_CATALOG=y
    artifact-name: universal_catalog_combined_128x64
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_UNIVERSAL_DONGLE_CATALOG=y -DCONFIG_ZMK_UNIVERSAL_STORE_EXPERIMENT=y
    artifact-name: universal_catalog_storage_compilecheck_128x64

  # Compile-check the opt-in identity handshake with capacity for both split pairs.
  # This remains a validation build, not a flash-ready universal keymap.
  - board: nice_nano//zmk
    shield: chocofi_central_dongle_128x64 dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_UNIVERSAL_DONGLE_CENTRAL_IDENTITY=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=4 -DCONFIG_BT_MAX_CONN=7 -DCONFIG_BT_MAX_PAIRED=7
    artifact-name: universal_identity_central_compilecheck_128x64
  # Peripheral MCU targets must match each shield's wiring and current ZMK board variants:
  # Hana halves use XIAO nRF52840; Chocofi's Pro Micro footprint uses nice!nano-compatible wiring.
  - board: xiao_ble//zmk
    shield: hana_peripheral_left
    artifact-name: universal_identity_hana_left_compilecheck
  - board: xiao_ble//zmk
    shield: hana_peripheral_right
    artifact-name: universal_identity_hana_right_compilecheck
  - board: nice_nano//zmk
    shield: chocofi_peripheral_left
    artifact-name: universal_identity_chocofi_left_compilecheck
  - board: nice_nano//zmk
    shield: chocofi_peripheral_right
    artifact-name: universal_identity_chocofi_right_compilecheck
